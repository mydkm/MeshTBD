<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">MeshData interoperability validation diagram</title>
  <desc id="desc">PyMeshLab to MeshData to PyVista is the active contract-tested bridge. Trimesh and Blender adapter paths are tested. Open3D and PyMeshLab native runtime validation remain pending.</desc>
  <defs>
    <marker id="arrow-teal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#178F84"/></marker>
    <marker id="arrow-gray" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#8AA0B2"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#102A43" flood-opacity="0.14"/></filter>
  </defs>
  <rect width="1600" height="900" fill="#FBFCFD"/><rect width="1600" height="122" fill="#102A43"/><rect y="122" width="1600" height="10" fill="#178F84"/>
  <text x="800" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-size="42" font-weight="700" fill="#FFFFFF">MeshData Interoperability</text>
  <text x="800" y="99" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#CFE5ED">Tested adapters and one bounded active-pipeline bridge</text>
  <line x1="445" y1="430" x2="652" y2="430" stroke="#178F84" stroke-width="14" marker-end="url(#arrow-teal)"/><line x1="948" y1="430" x2="1155" y2="430" stroke="#178F84" stroke-width="14" marker-end="url(#arrow-teal)"/>
  <text x="548" y="397" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#0E6F68">ACTIVE</text><text x="1052" y="397" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#0E6F68">ACTIVE</text>
  <line x1="690" y1="338" x2="490" y2="259" stroke="#8AA0B2" stroke-width="6" stroke-dasharray="14 12" marker-end="url(#arrow-gray)"/><line x1="910" y1="338" x2="1110" y2="259" stroke="#8AA0B2" stroke-width="6" stroke-dasharray="14 12" marker-end="url(#arrow-gray)"/><line x1="800" y1="545" x2="800" y2="677" stroke="#8AA0B2" stroke-width="6" stroke-dasharray="14 12" marker-end="url(#arrow-gray)"/>
  <g filter="url(#shadow)"><rect x="650" y="315" width="300" height="230" rx="28" fill="#183B56"/><text x="800" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="40" font-weight="700" fill="#FFFFFF">MeshData</text><text x="800" y="438" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#86D4CC">V • F • VN • FN • C</text><text x="800" y="486" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#DCEAF0">Validated canonical contract</text><rect x="705" y="505" width="190" height="32" rx="16" fill="#178F84"/><text x="800" y="528" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">COLORS: FLOAT [0,1]</text></g>
  <g filter="url(#shadow)"><rect x="105" y="340" width="340" height="180" rx="24" fill="#E4F3F1" stroke="#178F84" stroke-width="4"/><text x="275" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#102A43">PyMeshLab</text><text x="275" y="449" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#31495A">Voronoi-colored surface</text><rect x="174" y="470" width="202" height="34" rx="17" fill="#178F84"/><text x="275" y="494" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">CONTRACT PASS</text></g>
  <g filter="url(#shadow)"><rect x="1155" y="340" width="340" height="180" rx="24" fill="#E4F3F1" stroke="#178F84" stroke-width="4"/><text x="1325" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#102A43">PyVista</text><text x="1325" y="449" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#31495A">HSV region selection</text><rect x="1224" y="470" width="202" height="34" rx="17" fill="#178F84"/><text x="1325" y="494" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">RUNTIME PASS</text></g>
  <g filter="url(#shadow)"><rect x="170" y="168" width="320" height="132" rx="22" fill="#FFFFFF" stroke="#8AA0B2" stroke-width="3"/><text x="330" y="219" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#102A43">trimesh</text><text x="330" y="261" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#178F84">ROUND TRIP PASS</text></g>
  <g filter="url(#shadow)"><rect x="1110" y="168" width="320" height="132" rx="22" fill="#FFF0E3" stroke="#D9792B" stroke-width="3"/><text x="1270" y="219" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#102A43">Open3D</text><text x="1270" y="253" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#B45C18">API VERIFIED</text><text x="1270" y="277" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#7D552F">Runtime retest required</text></g>
  <g filter="url(#shadow)"><rect x="640" y="677" width="320" height="132" rx="22" fill="#FFFFFF" stroke="#8AA0B2" stroke-width="3"/><text x="800" y="728" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#102A43">Blender / bpy</text><text x="800" y="770" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#178F84">INBOUND TEST PASS</text></g>
  <rect x="140" y="838" width="1320" height="42" rx="21" fill="#EAF1F8"/><text x="800" y="866" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#31495A">Contract test preserves triangle topology + vertex colors across the active PyMeshLab → MeshData → PyVista bridge</text>
</svg>
